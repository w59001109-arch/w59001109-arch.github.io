<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>小工具</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0f1117;
      color: #f1f5f9;
      font-family: -apple-system, 'Noto Sans TC', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      gap: 12px;
    }
    h1 {
      font-size: 18px;
      color: #64748b;
      font-weight: 400;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }
    a.tool {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 320px;
      padding: 16px 20px;
      border-radius: 16px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      transition: background 0.15s;
    }
    a.tool:active { background: #273549; }
    .icon { font-size: 26px; width: 36px; text-align: center; }
    .sub { font-size: 12px; color: #64748b; font-weight: 400; margin-top: 2px; }
  </style>
</head>
<body>
  <h1>工具列表</h1>
  <a class="tool" href="/voice/">
    <span class="icon">🎙️</span>
    <div><div>語音轉文字</div><div class="sub">台語 / 中文辨識</div></div>
  </a>
  <a class="tool" href="/plant-tracker/">
    <span class="icon">🌱</span>
    <div><div>植物日誌</div><div class="sub">施肥・消毒・換盆</div></div>
  </a>
  <a class="tool" href="/Parrot-notebook/">
    <span class="icon">🦜</span>
    <div><div>鸚鵡日誌</div><div class="sub">鸚鵡照護記錄</div></div>
  </a>
  <a class="tool" href="/Ac-/">
    <span class="icon">🧪</span>
    <div><div>活性碳計算</div><div class="sub">活性碳 & 小蘇打用量</div></div>
  </a>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(r => r.unregister());
      });
    }
  </script>
</body>
</html>
